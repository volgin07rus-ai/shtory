<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · Шторме</title>
<link rel="icon" href="/img/brand-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#EFEBE4;--ink:#2A211E;--text:#4A3F3B;--muted:#7D706B;--wine:#6B2D33;--line:rgba(42,33,30,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{display:grid;place-items:center;padding:24px;color:var(--text);font:400 16px/1.6 'Inter',system-ui,sans-serif;text-align:center}
img{display:block;width:170px;height:auto;margin:0 auto 40px}
h1{font:300 clamp(34px,5vw,56px)/1.1 'Noto Serif Display',Georgia,serif;font-stretch:90%;color:var(--ink)}
p{margin-top:16px;color:var(--muted)}
a.back{display:inline-block;margin-top:32px;padding-bottom:5px;border-bottom:1px solid rgba(107,45,51,.35);font:600 12px/1 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);text-decoration:none}
a.back:hover{border-color:var(--wine)}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Шторме, на главную"><img src="/img/logo.svg" alt="Шторме · интерьерный текстиль" width="170" height="47"></a>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела. Всё о салоне на главной странице</p>
  <a class="back" href="/">На главную</a>
</main>
</body>
</html>
